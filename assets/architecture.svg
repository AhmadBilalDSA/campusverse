<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <style>
      .box { fill: #f8f6f1; stroke: #1a2744; stroke-width: 2; rx: 12; }
      .title { font-size: 16px; font-weight: 700; fill: #1a2744; }
      .label { font-size: 13px; fill: #4a5568; }
      .highlight { fill: #1a2744; }
      .arrow { stroke: #1a2744; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
      .blocked { stroke: #c53030; stroke-width: 3; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#1a2744"/>
    </marker>
  </defs>

  <!-- Internet (blocked) -->
  <g opacity="0.35">
    <rect x="620" y="40" width="140" height="80" rx="12" fill="#f8f6f1" stroke="#c53030" stroke-width="2" stroke-dasharray="6,4"/>
    <text x="690" y="70" text-anchor="middle" class="title" fill="#c53030">Internet</text>
    <text x="690" y="92" text-anchor="middle" class="label" fill="#c53030">not needed</text>
    <line x1="630" y1="50" x2="750" y2="110" class="blocked"/>
  </g>

  <!-- Students -->
  <rect x="40" y="140" width="160" height="120" rx="12" class="box"/>
  <text x="120" y="170" text-anchor="middle" class="title">Students</text>
  <text x="120" y="195" text-anchor="middle" class="label">Laptops and phones</text>
  <text x="120" y="215" text-anchor="middle" class="label">Campus WiFi</text>
  <text x="120" y="240" text-anchor="middle" class="label" font-size="24">📱 💻</text>

  <!-- Campus Server -->
  <rect x="300" y="60" width="220" height="280" rx="12" class="box" stroke-width="3"/>
  <text x="410" y="90" text-anchor="middle" class="title" font-size="18">Campus Server</text>
  <text x="410" y="112" text-anchor="middle" class="label">One machine, E: drive</text>

  <rect x="320" y="130" width="180" height="55" rx="8" fill="#e8e4da" stroke="#1a2744" stroke-width="1.5"/>
  <text x="410" y="152" text-anchor="middle" class="title" font-size="14">Next.js Web App</text>
  <text x="410" y="170" text-anchor="middle" class="label">Port 3000 · EN/UR</text>

  <rect x="320" y="195" width="180" height="55" rx="8" fill="#e8e4da" stroke="#1a2744" stroke-width="1.5"/>
  <text x="410" y="217" text-anchor="middle" class="title" font-size="14">Meilisearch</text>
  <text x="410" y="235" text-anchor="middle" class="label">293,522 records</text>

  <rect x="320" y="260" width="180" height="55" rx="8" fill="#e8e4da" stroke="#1a2744" stroke-width="1.5"/>
  <text x="410" y="282" text-anchor="middle" class="title" font-size="14">Library Storage</text>
  <text x="410" y="300" text-anchor="middle" class="label">43,522 full-text books</text>

  <!-- Arrows -->
  <line x1="200" y1="200" x2="295" y2="200" class="arrow"/>
  <text x="248" y="190" text-anchor="middle" class="label" font-size="11">search &amp; read</text>

  <!-- Stats bar -->
  <rect x="40" y="300" width="480" height="40" rx="8" fill="#1a2744"/>
  <text x="280" y="325" text-anchor="middle" fill="#f8f6f1" font-size="14" font-weight="600">293,522 records · 1,094,881 passages · 43,522 full-text books</text>
</svg>
